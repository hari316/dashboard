<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekenders Player Ratings</title>
<style>
:root {
  --bg: #0e0f11;
  --panel: #16181c;
  --panel-2: #1c1f24;
  --stroke: #2a2e35;
  --text: #e6e8eb;
  --text-2: #a2a8b0;
  --text-3: #6f757d;
  --accent: #4c8dff;
  --green: #3fb950;
  --blue: #4c8dff;
  --red: #f0616d;
  --amber: #d29922;
  --violet: #a371f7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: 28px;
}
.wrap { max-width: 1160px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 24px 0 10px; }
p.sub { color: var(--text-2); margin: 0 0 18px; max-width: 820px; }
.callout {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--text-2);
}
.callout b { color: var(--text); }
.callout.warn { border-left: 3px solid var(--amber); }
code {
  background: var(--panel-2);
  border: 1px solid var(--stroke);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
  color: var(--text);
}
.card {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 18px;
}
.card h3 { margin: 0 0 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
.ctrl label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.ctrl .hint { color: var(--text-3); font-size: 12px; margin-top: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  border: 1px solid var(--stroke);
  background: var(--panel-2);
  color: var(--text-2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pill.lg { padding: 7px 18px; font-size: 14px; font-weight: 600; }
select {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--stroke);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  width: 100%;
  color-scheme: dark;
}
.switch { display: flex; align-items: center; gap: 8px; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 22px; margin: 4px 0 20px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .v.info { color: var(--accent); }
.stat .l { font-size: 12px; color: var(--text-3); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--stroke); white-space: nowrap; }
th { color: var(--text-3); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
th:nth-child(2), td:nth-child(2) { text-align: left; }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
td.rating-active { font-weight: 700; color: var(--accent); }
td.rating-muted { color: var(--text-3); }
td.nq { color: var(--text-3); }
tr.nqrow { opacity: .62; }
.tone { border-left: 3px solid transparent; }
.tone.success { border-left-color: var(--green); }
.tone.info { border-left-color: var(--blue); }
.tone.danger { border-left-color: var(--red); }
.caption { font-size: 12px; color: var(--text-3); margin-top: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.badge {
  display: inline-block; border-radius: 999px; padding: 1px 9px;
  font-size: 11px; font-weight: 600; border: 1px solid transparent;
}
.badge.bat { color: #9dc3ff; background: rgba(76,141,255,.14); border-color: rgba(76,141,255,.35); }
.badge.bowl { color: #8ee79b; background: rgba(63,185,80,.14); border-color: rgba(63,185,80,.35); }
.badge.ar { color: #c9a6ff; background: rgba(163,113,247,.16); border-color: rgba(163,113,247,.38); }
.badge.prov { color: #b9c0c8; background: rgba(255,255,255,.06); border-color: var(--stroke); }
.pass { color: var(--green); }
.fail { color: var(--text-3); }
td.left, th.left { text-align: left; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-3); }
</style>
</head>

<div class="wrap">
  <h1>Weekenders Player Ratings</h1>

]);

function fmt(n, d = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return "\u2014";
  return n.toFixed(d);
}
function nq(n, d = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return "NQ";
  return n.toFixed(d);
}
// Balls -> cricket over notation (e.g. 50 balls = 8.2 overs).
function overs(balls) {
  return Math.floor(balls / 6) + "." + (balls % 6);
}

function aggregate(season) {
  const rows = season === "Career" ? DATA : DATA.filter(r => r.season === season);
  const map = new Map();
  for (const r of rows) {
    const a = map.get(r.player) || {player:r.player,games:0,runs:0,balls:0,out:0,inns:0,
                                    bBalls:0,bRuns:0,wkts:0,ppBalls:0,ppRuns:0};
    a.games += r.games; a.runs += r.runs; a.balls += r.balls; a.out += r.out; a.inns += r.inns;
    a.bBalls += r.bBalls; a.bRuns += r.bRuns; a.wkts += r.wkts;
    a.ppBalls += r.ppBalls; a.ppRuns += r.ppRuns;
    map.set(r.player, a);
  }
  const list = [...map.values()];
  for (const a of list) {
    a.avg = a.out > 0 ? a.runs / a.out : (a.runs > 0 ? a.runs : null);
    a.sr = a.balls > 0 ? (a.runs / a.balls) * 100 : null;
    // Policy excludes the powerplay from bowling ratings.
    a.oBalls = state.excludePP ? a.bBalls - a.ppBalls : a.bBalls;
    a.oRuns = state.excludePP ? a.bRuns - a.ppRuns : a.bRuns;
    a.ov = a.oBalls / 6;
    a.econ = a.oBalls > 0 ? a.oRuns / (a.oBalls / 6) : null;
    a.bsr = a.wkts > 0 ? a.oBalls / a.wkts : null;
  }
  return list;
}

// Team reference values = squad totals over the selected window.
function teamRefs(list) {
  let runs=0, balls=0, out=0, oBalls=0, oRuns=0, wkts=0;
  for (const a of list) {
    runs += a.runs; balls += a.balls; out += a.out;
    oBalls += a.oBalls; oRuns += a.oRuns; wkts += a.wkts;
  }
  return {
    avg: out > 0 ? runs / out : null,
    sr: balls > 0 ? runs / balls * 100 : null,
    econ: oBalls > 0 ? oRuns / (oBalls / 6) : null,
    bsr: wkts > 0 ? oBalls / wkts : null,
    runs, balls, out, oBalls, oRuns, wkts,
  };
}

// Ascending rank / cohort size, as a percentage. Lowest rating = 1/N.
function assignPercentiles(pool, key, target) {
  const sorted = [...pool].sort((x, y) => x[key] - y[key]);
  sorted.forEach((a, i) => { a[target] = (i + 1) / sorted.length * 100; });
}

function classify(a) {
  const g = state.arGate;
  if (!a.evidenceOK) {
    return {role:"Provisional", check:`Below ${state.minGames} games / ${state.minInns} innings`, final:null};
  }
  const availOK = !state.applyAvailability || !state.bowlingUnconfirmed.has(a.player);
  const declaredBowler = state.applyDeclaredRoles && DECLARED_BOWLERS.has(a.player);

  if (a.batQ && a.bowlQ) {
    if (a.batPctl >= g && a.bowlPctl >= g && availOK) {
      return {role:"All-rounder", check:"Pass", final:a.arRating};
    }
    let check;
    if (!availOK) check = "Bowling availability not confirmed";
    else if (a.batPctl < g && a.bowlPctl < g) check = "Both percentiles below " + g + "%";
    else if (a.batPctl < g) check = "Batting percentile below " + g + "%";
    else check = "Bowling percentile below " + g + "%";
    // A declaration overrides the percentile comparison for the specialist label.
    const role = declaredBowler ? "Bowler" : (a.batPctl >= a.bowlPctl ? "Batsman" : "Bowler");
    if (declaredBowler) check += " \u00b7 declared bowler";
    return {role, check, final: role === "Batsman" ? a.batRating : a.bowlRating};
  }
  if (a.batQ) return {role:"Batsman", check:"No qualified Bowling Rating", final:a.batRating};
  if (a.bowlQ) return {role:"Bowler", check:"No qualified Batting Rating", final:a.bowlRating};
  return {role:"Provisional", check:"No qualified rating", final:null};
}

function computePolicy() {
  const all = aggregate(state.season);
  const computed = teamRefs(all);
  const ref = state.refBasis === "policy" ? Object.assign({}, computed, POLICY_REF) : computed;
  const wb = state.wBatAvg / 100;
  const wo = state.wBowlEcon / 100;

  for (const a of all) {
    a.evidenceOK = a.games >= state.minGames && a.inns >= state.minInns;
    a.batQ = a.evidenceOK && a.avg !== null && a.sr !== null && ref.avg > 0 && ref.sr > 0;
    a.bowlQ = a.evidenceOK && a.ov >= state.minOvers && a.wkts >= state.minWkts
              && a.econ !== null && a.econ > 0 && a.bsr !== null && a.bsr > 0
              && ref.econ > 0 && ref.bsr > 0;

    a.avgRtg = a.batQ ? a.avg / ref.avg * 100 : null;
    a.srRtg = a.batQ ? a.sr / ref.sr * 100 : null;
    a.batRating = a.batQ ? wb * a.avgRtg + (1 - wb) * a.srRtg : null;

    // Lower is better for both bowling metrics, so the ratio is inverted.
    a.econRtg = a.bowlQ ? ref.econ / a.econ * 100 : null;
    a.bsrRtg = a.bowlQ ? ref.bsr / a.bsr * 100 : null;
    a.bowlRating = a.bowlQ ? wo * a.econRtg + (1 - wo) * a.bsrRtg : null;

    a.arRating = (a.batRating !== null && a.bowlRating !== null && a.batRating + a.bowlRating > 0)
      ? 2 * a.batRating * a.bowlRating / (a.batRating + a.bowlRating) : null;
  }

  assignPercentiles(all.filter(a => a.batQ), "batRating", "batPctl");
  assignPercentiles(all.filter(a => a.bowlQ), "bowlRating", "bowlPctl");

  for (const a of all) {
    const c = classify(a);
    a.role = c.role; a.check = c.check; a.finalRating = c.final;
  }

  const batCohort = all.filter(a => a.batQ).length;
  const bowlCohort = all.filter(a => a.bowlQ).length;
  const counts = {
    Batsman: all.filter(a => a.role === "Batsman").length,
    Bowler: all.filter(a => a.role === "Bowler").length,
    "All-rounder": all.filter(a => a.role === "All-rounder").length,
    Provisional: all.filter(a => a.role === "Provisional").length,
  };
  return {all, ref, computed, batCohort, bowlCohort, counts};
}

// Exploratory batting-only model, retained from the original dashboard. Unlike
// the policy rating, each metric is graded against the team's best rather than
// the squad average, so 100 means "equal to the best in the squad".
function computeSimple() {
  const s = state;
  const all = aggregate(s.season);
  const qualified = all.filter(a => a.inns >= s.minInns && a.avg !== null && a.sr !== null);
  const bestAvg = qualified.reduce((m,a) => Math.max(m, a.avg || 0), 0);
  const bestRuns = qualified.reduce((m,a) => Math.max(m, a.runs), 0);
  const bestSR = qualified.reduce((m,a) => Math.max(m, a.sr || 0), 0);
  const [sWA, sWR, sWS] = s.wSimpleSplit.split("-").map(n => Number(n) / 100);

  const scored = qualified.map(a => {
    const sAvgR = bestAvg > 0 ? Math.min(100, a.avg / bestAvg * 100) : 0;
    const sRunsR = bestRuns > 0 ? Math.min(100, a.runs / bestRuns * 100) : 0;
    const sSrR = bestSR > 0 ? Math.min(100, a.sr / bestSR * 100) : 0;
    return Object.assign({}, a, {sAvgR, sRunsR, sSrR, rating: sWA*sAvgR + sWR*sRunsR + sWS*sSrR});
  }).sort((x,y) => y.rating - x.rating);

  return {scored, bestAvg, bestRuns, bestSR,
          bestAvgPlayer: (qualified.find(a=>a.avg===bestAvg)||{}).player || "\u2014",
          bestRunsPlayer: (qualified.find(a=>a.runs===bestRuns)||{}).player || "\u2014",
          bestSRPlayer: (qualified.find(a=>a.sr===bestSR)||{}).player || "\u2014"};
}

function pills(options, current, onPick, suffix, big) {
  const div = document.createElement("div");
  div.className = "pills";
  for (const o of options) {
    const b = document.createElement("div");
    b.className = "pill" + (big ? " lg" : "") + (o === current ? " active" : "");
    b.textContent = o + (suffix || "");
    b.onclick = () => { onPick(o); render(); };
    div.appendChild(b);
  }
  return div;
}

function labelledPills(options, current, onPick, big) {
  const div = document.createElement("div");
  div.className = "pills";
  for (const [v, l] of options) {
    const b = document.createElement("div");
    b.className = "pill" + (big ? " lg" : "") + (v === current ? " active" : "");
    b.textContent = l;
    b.onclick = () => { onPick(v); render(); };
    div.appendChild(b);
  }
  return div;
}

function ctrl(label, node, hint) {
  const d = document.createElement("div");
  d.className = "ctrl";
  const l = document.createElement("label"); l.textContent = label; d.appendChild(l);
  d.appendChild(node);
  if (hint) { const h = document.createElement("div"); h.className = "hint"; h.textContent = hint; d.appendChild(h); }
  return d;
}

function checkbox(labelText, checked, onChange) {
  const row = document.createElement("div"); row.className = "switch";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = checked;
  cb.onchange = () => { onChange(cb.checked); render(); };
  const sp = document.createElement("span"); sp.textContent = labelText;
  row.appendChild(cb); row.appendChild(sp);
  return row;
}

// Bowling availability is a declared field, so it gets an editable panel rather
// than being buried in a constant. Only players who already hold a qualified
// Bowling Rating can be affected by the gate, so only they are listed.
function renderAvailability(r) {
  const card = document.getElementById("availCard");
  const pool = r.all.filter(a => a.bowlQ).sort((x, y) => x.player.localeCompare(y.player));
  card.innerHTML = "";
  if (!pool.length) { card.style.display = "none"; return; }
  card.style.display = "";

  const h = document.createElement("h3");
  h.textContent = "Bowling availability \u2014 declared per player";
  card.appendChild(h);

  const note = document.createElement("div");
  note.style.cssText = "color:var(--text-3);font-size:12px;margin:-6px 0 14px";
  note.textContent = state.applyAvailability
    ? "Ticked = confirmed regular bowling availability. Section 3 requires this for All-rounder status, so unticking a player caps them at their specialist role. Defaults follow the policy role table."
    : "The availability gate is switched off above, so these declarations are currently ignored.";
  card.appendChild(note);

  const grid = document.createElement("div");
  grid.className = "grid";
  for (const a of pool) {
    const confirmed = !state.bowlingUnconfirmed.has(a.player);
    const gatedOnlyByAvailability = !confirmed && state.applyAvailability
      && a.batPctl >= state.arGate && a.bowlPctl >= state.arGate;

    const row = document.createElement("div");
    row.appendChild(checkbox(a.player, confirmed, v => {
      if (v) state.bowlingUnconfirmed.delete(a.player);
      else state.bowlingUnconfirmed.add(a.player);
    }));
    const sub = document.createElement("div");
    sub.style.cssText = "font-size:12px;color:var(--text-3);margin:2px 0 0 24px";
    sub.innerHTML = `Bowling ${fmt(a.bowlRating)} at ${Math.round(a.bowlPctl)}% &middot; ${badge(a.role)}`
      + (gatedOnlyByAvailability
          ? ` <span style="color:var(--amber)">&mdash; clears both percentile gates; would be an All-rounder at ${fmt(a.arRating)} if confirmed</span>`
          : "");
    row.appendChild(sub);
    grid.appendChild(row);
  }
  card.appendChild(grid);
}

function badge(role) {
  const cls = role === "Batsman" ? "bat" : role === "Bowler" ? "bowl"
            : role === "All-rounder" ? "ar" : "prov";
  return `<span class="badge ${cls}">${role}</span>`;
}

function render() {
  const d = state.discipline;
  const policyMode = state.model === "policy" || d !== "batting";

  // ---- discipline toggle ----------------------------------------------------
  const discDiv = document.getElementById("discipline");
  discDiv.innerHTML = "";
  discDiv.appendChild(labelledPills(
    [["batting","Batting"],["bowling","Bowling"],["allrounder","All-rounder"]],
    d, v => {
      state.discipline = v;
      if (v !== "batting") state.model = "policy";
    }, true));
  document.getElementById("disciplineHint").textContent =
    d === "batting" ? "Batting Rating = 70% Average Rating + 30% Strike Rate Rating."
    : d === "bowling" ? "Bowling Rating = 70% Economy Rating + 30% Bowling Strike Rate Rating. Powerplay excluded."
    : "All-rounder Rating = harmonic mean of the two discipline ratings, gated on both percentiles.";

  // ---- model toggle (batting only) -----------------------------------------
  const modelWrap = document.getElementById("modelWrap");
  const modelDiv = document.getElementById("model");
  if (d === "batting") {
    modelWrap.style.display = "";
    modelDiv.innerHTML = "";
    modelDiv.appendChild(labelledPills(
      [["policy","Policy (70 Avg / 30 SR)"],["simple","Simple (Avg + Runs + SR)"]],
      state.model, v => state.model = v));
    document.getElementById("modelHint").textContent =
      "Policy = the team policy formula, graded against the squad average. Simple is an exploratory model graded against the team's best.";
  } else {
    modelWrap.style.display = "none";
  }

  if (policyMode) renderPolicy(); else renderSimple();
}

function renderPolicy() {
  const d = state.discipline;
  const r = computePolicy();
  const ref = r.ref;

  document.getElementById("subtitle").textContent =
    d === "batting" ? "Batting Rating from the Summer / Fall 2026 Team Policy: average and strike rate are each expressed as a percentage of the squad reference, then blended 70 / 30. A rating of 100 equals the reference."
    : d === "bowling" ? "Bowling Rating from the Summer / Fall 2026 Team Policy: economy and bowling strike rate are each expressed against the squad reference (inverted, because lower is better), then blended 70 / 30. Powerplay overs are excluded."
    : "All-rounder Rating from the Summer / Fall 2026 Team Policy: the harmonic mean of the Batting and Bowling Ratings. Qualification is an AND rule on both discipline percentiles.";

  const g = state.arGate;
  document.getElementById("formula").innerHTML =
    d === "batting"
      ? `<b>Formula.</b> Average Rating = player average / reference average (<code>${fmt(ref.avg,4)}</code>) &times; 100 &middot; Strike Rate Rating = player SR / reference SR (<code>${fmt(ref.sr,4)}</code>) &times; 100<br>Batting Rating = <code>${state.wBatAvg}%</code> &times; Average Rating + <code>${100-state.wBatAvg}%</code> &times; Strike Rate Rating &middot; Percentile = ascending rank within the ${r.batCohort}-player qualified cohort.`
      : d === "bowling"
      ? `<b>Formula.</b> Economy Rating = reference economy (<code>${fmt(ref.econ,4)}</code>) / player economy &times; 100 &middot; Bowling SR Rating = reference bowling SR (<code>${fmt(ref.bsr,4)}</code>) / player bowling SR &times; 100<br>Bowling Rating = <code>${state.wBowlEcon}%</code> &times; Economy Rating + <code>${100-state.wBowlEcon}%</code> &times; Bowling SR Rating &middot; Percentile = ascending rank within the ${r.bowlCohort}-player qualified cohort.`
      : `<b>Formula.</b> All-rounder Rating = 2 &times; Batting Rating &times; Bowling Rating / (Batting Rating + Bowling Rating)<br>Gate = Batting Percentile &ge; <code>${g}%</code> <b>AND</b> Bowling Percentile &ge; <code>${g}%</code>, plus evidence and confirmed bowling availability. A high percentile in one discipline cannot compensate for the other.`;

  // ---- controls -------------------------------------------------------------

  c.innerHTML = "";

  const seasonSel = document.createElement("select");
  SEASONS.forEach(s => {
    const o = document.createElement("option"); o.value = s;
    o.textContent = s === "Career" ? "Career (policy evidence window)" : s;
    if (s === state.season) o.selected = true; seasonSel.appendChild(o);
  });
  seasonSel.onchange = () => { state.season = seasonSel.value; render(); };
  c.appendChild(ctrl("Season", seasonSel, "Career aggregates all four competitions in the policy evidence window."));

  c.appendChild(ctrl("Reference basis",
    labelledPills([["computed","Computed from season"],["policy","Policy published"]],
      state.refBasis, v => state.refBasis = v),
    "Computed = squad totals for the selected season. Policy published = the Draft 3.6 appendix values."));

  if (d === "batting" || d === "allrounder") {
    c.appendChild(ctrl(`Batting weight \u2014 Avg ${state.wBatAvg}% / SR ${100-state.wBatAvg}%`,
      pills([50,60,70,80], state.wBatAvg, v => state.wBatAvg = v, "%"), "Policy value is 70% on Average Rating."));
  }
  if (d === "bowling" || d === "allrounder") {
    c.appendChild(ctrl(`Bowling weight \u2014 Econ ${state.wBowlEcon}% / B.SR ${100-state.wBowlEcon}%`,
      pills([50,60,70,80], state.wBowlEcon, v => state.wBowlEcon = v, "%"), "Policy value is 70% on Economy Rating."));
  }

  c.appendChild(ctrl("Evidence gate \u2014 minimum games",
    pills([1,3,5,8], state.minGames, v => state.minGames = v), "Policy gate is 5 games AND 5 innings."));
  c.appendChild(ctrl("Evidence gate \u2014 minimum innings",
    pills([1,3,5,8], state.minInns, v => state.minInns = v), "Below either minimum the player is Provisional."));

  if (d === "bowling" || d === "allrounder") {
    c.appendChild(ctrl("Bowling gate \u2014 minimum overs",
      pills([0,4,8,12], state.minOvers, v => state.minOvers = v), "Policy gate is at least 8 overs and 1 wicket."));
    c.appendChild(ctrl("Bowling gate \u2014 minimum wickets",
      pills([0,1,2,3], state.minWkts, v => state.minWkts = v)));
  }

  if (d === "allrounder") {
    c.appendChild(ctrl("All-rounder percentile gate",
      pills([40,50,60], state.arGate, v => state.arGate = v, "%"),
      "Scenario 3 of the policy adopts the 50th percentile. Exactly 50% passes."));
  }

  const flags = document.createElement("div");
  flags.appendChild(checkbox("Exclude powerplay from bowling", state.excludePP, v => state.excludePP = v));
  const availRow = checkbox("Apply bowling-availability gate", state.applyAvailability, v => state.applyAvailability = v);
  availRow.style.marginTop = "10px";
  flags.appendChild(availRow);
  const declRow = checkbox("Use declared primary role for specialists", state.applyDeclaredRoles, v => state.applyDeclaredRoles = v);
  declRow.style.marginTop = "10px";
  flags.appendChild(declRow);
  c.appendChild(ctrl("Policy options", flags,
    "All-rounder status requires confirmed regular bowling availability. Declared roles settle the Batsman / Bowler label when the All-rounder gate fails; unchecking falls back to comparing percentiles."));

  // ---- headline stats -------------------------------------------------------
  const stats = document.getElementById("stats");
  let items;
  if (d === "batting") {
    items = [[fmt(ref.avg,2), "Reference average = 100", true],
             [fmt(ref.sr,2), "Reference strike rate = 100", true],
             [String(r.batCohort), "Batting-qualified players", false]];
  } else if (d === "bowling") {
    items = [[fmt(ref.econ,2), "Reference economy = 100", true],
             [fmt(ref.bsr,2), "Reference bowling SR = 100", true],
             [String(r.bowlCohort), "Bowling-qualified players", false]];
  } else {
    items = [[String(r.counts["All-rounder"]), "All-rounders", true],
             [String(r.counts.Batsman), "Batsmen", false],
             [String(r.counts.Bowler), "Bowlers", false],
             [String(r.counts.Provisional), "Provisional", false]];
  }
  stats.innerHTML = items.map(([v,l,info]) =>
    `<div class="stat"><div class="v${info?" info":""}">${v}</div><div class="l">${l}</div></div>`).join("");

  // ---- table ----------------------------------------------------------------
  const title = d === "batting" ? "Batting Rating" : d === "bowling" ? "Bowling Rating" : "All-rounder Rating";
  document.getElementById("lbTitle").textContent = title + " \u2014 " + state.season;

  const key = d === "batting" ? "batRating" : d === "bowling" ? "bowlRating" : "finalRating";
  const isQ = a => d === "batting" ? a.batQ : d === "bowling" ? a.bowlQ : a.finalRating !== null;
  const rows = [...r.all].sort((x, y) => {
    const qx = isQ(x), qy = isQ(y);
    if (qx !== qy) return qx ? -1 : 1;
    if (!qx) return x.player.localeCompare(y.player);
    return y[key] - x[key];
  });

  let headers, cellsFor;
  if (d === "batting") {
    headers = ["#","Player","G","Inns","Runs","Avg","SR","Avg Rtg","SR Rtg","Batting Rating","Bat Pctl","Role"];
    cellsFor = (s, i) => [isQ(s) ? i+1 : "\u2014", s.player, s.games, s.inns, s.runs, fmt(s.avg), fmt(s.sr,2),
      nq(s.avgRtg), nq(s.srRtg), nq(s.batRating), s.batQ ? Math.round(s.batPctl)+"%" : "NQ", badge(s.role)];
  } else if (d === "bowling") {
    headers = ["#","Player","G","Ov","W","Econ","B.SR","Econ Rtg","B.SR Rtg","Bowling Rating","Bowl Pctl","Role"];
    cellsFor = (s, i) => [isQ(s) ? i+1 : "\u2014", s.player, s.games, overs(s.oBalls), s.wkts,
      s.econ !== null ? fmt(s.econ) : "\u2014", s.bsr !== null ? fmt(s.bsr,2) : "\u2014",
      nq(s.econRtg), nq(s.bsrRtg), nq(s.bowlRating), s.bowlQ ? Math.round(s.bowlPctl)+"%" : "NQ", badge(s.role)];
  } else {
    headers = ["#","Player","Batting Rating","Bat Pctl","Bowling Rating","Bowl Pctl","All-rounder Rating","Final Rating","Qualification check","Outcome"];
    cellsFor = (s, i) => [isQ(s) ? i+1 : "\u2014", s.player, nq(s.batRating),
      s.batQ ? Math.round(s.batPctl)+"%" : "NQ", nq(s.bowlRating), s.bowlQ ? Math.round(s.bowlPctl)+"%" : "NQ",
      nq(s.arRating), nq(s.finalRating),
      `<span class="${s.check==="Pass"?"pass":"fail"}">${s.check}</span>`, badge(s.role)];
  }

  const thead = "<thead><tr>" + headers.map((h,i) =>
    `<th class="${i===1?"left":""}">${h}</th>`).join("") + "</tr></thead>";

  const ratingCol = d === "allrounder" ? headers.indexOf("Final Rating") : headers.indexOf(title);
  const body = rows.map((s, i) => {
    const val = s[key];
    const tone = !isQ(s) ? "" : val >= 105 ? "success" : val >= 95 ? "info" : val < 80 ? "danger" : "";
    const cells = cellsFor(s, i);
    return `<tr class="tone ${tone}${isQ(s) ? "" : " nqrow"}">` + cells.map((cell, ci) => {
      let cls = ci === 1 ? "left" : "";
      if (ci === ratingCol) cls += isQ(s) ? " rating-active" : " nq";
      if (d === "allrounder" && (ci === headers.length-2)) cls = "left";
      return `<td class="${cls.trim()}">${cell}</td>`;
    }).join("") + "</tr>";
  }).join("");
  renderAvailability(r);

  const empty = `<tr><td class="left" colspan="${headers.length}" style="color:var(--text-3);padding:14px 10px">`
    + `No player clears the evidence gate for this selection \u2014 lower the minimum games / innings above.</td></tr>`;
  document.getElementById("table").innerHTML = thead + "<tbody>" + (rows.some(isQ) ? body : empty + body) + "</tbody>";

  const refLabel = state.refBasis === "policy"
    ? "policy-published reference values"
    : `reference values computed from the ${state.season === "Career" ? "full evidence window" : state.season} squad totals`;
  document.getElementById("caption").innerHTML =
    `Roles: Batsmen ${r.counts.Batsman} &middot; Bowlers ${r.counts.Bowler} &middot; All-rounders ${r.counts["All-rounder"]} &middot; Provisional ${r.counts.Provisional}. `
    + `Rated against ${refLabel}. NQ = evidence threshold not met; NQ rows are listed last. `
    + `Full precision is used throughout; displayed values are rounded.`;

  document.getElementById("legend").innerHTML =
    `<span>Row colour: green &ge; 105 &middot; blue &ge; 95 &middot; red &lt; 80 (100 = reference)</span>`
    + `<span>Batting gate: ${state.minGames} games and ${state.minInns} innings</span>`
    + (d !== "batting" ? `<span>Bowling gate: ${state.minOvers} overs and ${state.minWkts} wicket(s)</span>` : "")
    + (state.excludePP ? `<span>Powerplay excluded from bowling</span>` : `<span>Powerplay included in bowling</span>`);
}

function renderSimple() {
  const r = computeSimple();
  document.getElementById("availCard").style.display = "none";

  document.getElementById("subtitle").textContent =
    "Simple model: average, total runs, and strike rate are each graded on a curve against the team's best, then blended by weight.";

  const [sWA, sWR, sWS] = state.wSimpleSplit.split("-");
  document.getElementById("formula").innerHTML =
    `<b>Formula.</b> Avg Rating = min(100, avg / best avg &times; 100) &middot; Runs Rating = min(100, runs / best runs &times; 100) &middot; SR Rating = min(100, SR / best SR &times; 100)<br>Rating = <code>${sWA}%</code> &times; Avg + <code>${sWR}%</code> &times; Runs + <code>${sWS}%</code> &times; SR`;

  const c = document.getElementById("controls");
  c.innerHTML = "";

  const seasonSel = document.createElement("select");
  SEASONS.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = s; if (s===state.season) o.selected = true; seasonSel.appendChild(o); });
  seasonSel.onchange = () => { state.season = seasonSel.value; render(); };
  c.appendChild(ctrl("Season", seasonSel, "Career aggregates all four competitions."));

  c.appendChild(ctrl("Minimum innings (qualification)",
    pills([1,2,3,5,8], state.minInns, v => state.minInns = v), "Filters out tiny samples."));

  const splitSel = document.createElement("select");
  [["60-00-40","Avg 60 / Runs 0 / SR 40"],["50-20-30","Avg 50 / Runs 20 / SR 30"],
   ["40-30-30","Avg 40 / Runs 30 / SR 30"],["40-20-40","Avg 40 / Runs 20 / SR 40"],
   ["34-33-33","Avg 34 / Runs 33 / SR 33"],["50-30-20","Avg 50 / Runs 30 / SR 20"]].forEach(([v,l]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = l; if (v===state.wSimpleSplit) o.selected = true; splitSel.appendChild(o);
  });
  splitSel.onchange = () => { state.wSimpleSplit = splitSel.value; render(); };
  c.appendChild(ctrl("Weight split \u2014 Avg / Runs / SR", splitSel, "How the three metrics are blended (sums to 100%)."));

  const stats = document.getElementById("stats");
  const statItems = [
    [fmt(r.bestAvg,2), `Best avg (${r.bestAvgPlayer.split(" ")[0]})`, false],
    [String(r.bestRuns), `Best runs (${r.bestRunsPlayer.split(" ")[0]})`, false],
    [fmt(r.bestSR,1), `Best SR (${r.bestSRPlayer.split(" ")[0]})`, true],
    [String(r.scored.length), "Qualified players", false],
  ];
  stats.innerHTML = statItems.map(([v,l,info]) => `<div class="stat"><div class="v${info?" info":""}">${v}</div><div class="l">${l}</div></div>`).join("");

  document.getElementById("lbTitle").textContent = "Leaderboard \u2014 " + state.season;
  const headers = ["#","Player","Inns","Runs","Avg","SR","Avg R","Runs R","SR R","Simple"];
  const thead = "<thead><tr>" + headers.map((h,i) => `<th class="${i===1?"left":""}">${h}</th>`).join("") + "</tr></thead>";
  const body = r.scored.map((s, i) => {
    const tone = s.rating >= 85 ? "success" : s.rating >= 55 ? "info" : s.rating < 35 ? "danger" : "";
    const cells = [i+1, s.player, s.inns, s.runs, fmt(s.avg), fmt(s.sr,1),
                   fmt(s.sAvgR,1), fmt(s.sRunsR,1), fmt(s.sSrR,1), fmt(s.rating,1)];
    return `<tr class="tone ${tone}">` + cells.map((cell,ci) => {
      let cls = ci === 1 ? "left" : "";
      if (ci === headers.length-1) cls += " rating-active";
      return `<td class="${cls.trim()}">${cell}</td>`;
    }).join("") + "</tr>";
  }).join("");
  document.getElementById("table").innerHTML = thead + "<tbody>" + body + "</tbody>";

  document.getElementById("caption").innerHTML =
    `Source: Weekenders_Player_Season_Stats_Updated.xlsx &middot; Sorted by the <b>Simple</b> rating (accent column).`;
  document.getElementById("legend").innerHTML =
    `<span>Row colour: green &ge; 85 &middot; blue &ge; 55 &middot; red &lt; 35</span>`
    + `<span>Exploratory model \u2014 not the team policy formula</span>`;
}

// Deep-link the discipline toggle, e.g. index.html#bowling
function applyHash() {
  const h = (location.hash || "").replace("#", "").toLowerCase();
  if (["batting","bowling","allrounder"].includes(h)) {
    state.discipline = h;
    if (h !== "batting") state.model = "policy";
  }
}
window.addEventListener("hashchange", () => { applyHash(); render(); });
applyHash();
render();
</script>
</body>
</html>
